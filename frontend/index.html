<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        charset="UTF-8">
    <title>Calculadora de Álcool</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Bibliotecas para tratamento de data (Day.js) -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/pt-br.js"></script>
</head>

<body>
    <div id="toast-container"></div>

    <!-- Modal de Confirmação -->
    <div id="modal-confirmacao" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-titulo">Limpar Histórico?</h3>
            <p id="modal-mensagem">Esta ação removerá todos os registros permanentemente.</p>
            <div class="modal-buttons">
                <button onclick="fecharModal()" class="btn-cancelar">Cancelar</button>
                <button id="btn-confirmar-modal" onclick="executarAcaoConfirmada()"
                    class="btn-confirmar-danger">Confirmar</button>
            </div>
        </div>
    </div>

    <div class="container">
        <h2 style="text-align: center;">Calculadora Custo-Benefício</h2>
        <nav>
            <button id="btn-nav-calc" class="active" onclick="mostrarTela('calculadora')">Calculadora</button>
            <button id="btn-nav-hist" onclick="mostrarTela('historico')">Ver Histórico</button>
        </nav>

        <hr>

        <div id="tela-calculadora">
            <h2>Nova Medição</h2>
            <div class="input-group">
                <label for="price">Preço da Bebida (R$)</label>
                <input type="number" id="price" placeholder="Ex: 15.90" step="0.01" inputmode="decimal">
            </div>
            <div class="input-group">
                <label for="volumeMl">Volume total (ml)</label>
                <input type="number" id="volumeMl" placeholder="Ex: 750" inputmode="numeric">
            </div>
            <div class="input-group">
                <label for="alcoholic">Teor Alcoólico (%)</label>
                <input type="number" id="alcoholic" placeholder="Ex: 12" inputmode="decimal">
            </div>

            <button id="btn-calcular" onclick="calcularCustoBeneficio()">Calcular</button>

            <div id="result"></div>
        </div>

        <div id="tela-historico" style="display: none;">
            <h2>Últimos Cálculos</h2>
            <div id="lista-historico">
            </div>

            <button onclick="limparHistorico()" id="btn-limpar">Limpar
                Histórico</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
